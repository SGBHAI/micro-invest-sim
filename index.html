<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-Investment Growth Projection</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #181b22;
    --border: #2a2f3a;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3b82f6;
    --accent-fill: rgba(59, 130, 246, 0.18);
    --secondary: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 24px; }
  .widget { background: var(--card); border: 1px solid var(--border); border-radius: 16px; max-width: 820px; width: 100%; padding: 24px; }
  h2 { font-size: 1.25rem; margin-bottom: 16px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .stat-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  .stat-val { font-size: 1.25rem; font-weight: 700; }
  .stat-val.positive { color: var(--secondary); }
  canvas { width: 100%; height: 300px; display: block; margin-bottom: 20px; }
  .sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .control { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .control-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; }
  .control-val { font-weight: 600; color: var(--accent); }
  input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .legend { display: flex; gap: 20px; font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>
<div class="widget">
  <h2>Micro-Investment Growth Projection</h2>
  <div class="summary">
    <div class="stat"><div class="stat-label">Starting Seed</div><div class="stat-val" id="sumInitial">₹250</div></div>
    <div class="stat"><div class="stat-label">Total Invested</div><div class="stat-val" id="sumInvested">₹36,250</div></div>
    <div class="stat"><div class="stat-label">Projected Corpus</div><div class="stat-val positive" id="sumTotal">₹69,731</div></div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--accent)"></i>Projected Corpus</span>
    <span><i class="dot" style="background:var(--secondary)"></i>Total Principal Invested</span>
  </div>
  <canvas id="chart"></canvas>
  <div class="sliders">
    <div class="control">
      <div class="control-header"><span>Starting amount</span><span class="control-val" id="valInitial">₹250</span></div>
      <input type="range" id="initial" min="100" max="5000" step="50" value="250">
    </div>
    <div class="control">
      <div class="control-header"><span>Monthly contribution</span><span class="control-val" id="valMonthly">₹300</span></div>
      <input type="range" id="monthly" min="0" max="10000" step="100" value="300">
    </div>
    <div class="control">
      <div class="control-header"><span>Expected annual return (%)</span><span class="control-val" id="valRate">12%</span></div>
      <input type="range" id="rate" min="6" max="20" step="0.5" value="12">
    </div>
    <div class="control">
      <div class="control-header"><span>Time horizon</span><span class="control-val" id="valYears">10 yrs</span></div>
      <input type="range" id="years" min="1" max="25" step="1" value="10">
    </div>
  </div>
</div>

<script>
  const fmtINR = n => '₹' + Math.round(n).toLocaleString('en-IN');
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');

  const inputs = {
    initial: document.getElementById('initial'),
    monthly: document.getElementById('monthly'),
    rate: document.getElementById('rate'),
    years: document.getElementById('years')
  };

  function calculateSeries(initial, monthly, rate, years) {
    const corpus = [];
    const invested = [];
    const r = rate / 100 / 12;
    for (let t = 0; t <= years; t++) {
      const inv = initial + monthly * 12 * t;
      const tot = rate > 0
        ? initial * Math.pow(1 + r, t * 12) + monthly * ((Math.pow(1 + r, t * 12) - 1) / r)
        : inv;
      invested.push(inv);
      corpus.push(tot);
    }
    return { corpus, invested };
  }

  function draw() {
    const initial = +inputs.initial.value;
    const monthly = +inputs.monthly.value;
    const rate = +inputs.rate.value;
    const years = +inputs.years.value;

    document.getElementById('valInitial').textContent = fmtINR(initial);
    document.getElementById('valMonthly').textContent = fmtINR(monthly);
    document.getElementById('valRate').textContent = rate + '%';
    document.getElementById('valYears').textContent = years + ' yrs';

    const { corpus, invested } = calculateSeries(initial, monthly, rate, years);

    document.getElementById('sumInitial').textContent = fmtINR(initial);
    document.getElementById('sumInvested').textContent = fmtINR(invested[years]);
    document.getElementById('sumTotal').textContent = fmtINR(corpus[years]);

    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);

    const w = rect.width;
    const h = rect.height;
    const pad = { top: 20, right: 20, bottom: 30, left: 65 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    ctx.clearRect(0, 0, w, h);

    const maxVal = Math.max(...corpus, 1000) * 1.1;
    const getX = t => pad.left + (t / years) * plotW;
    const getY = v => pad.top + plotH - (v / maxVal) * plotH;

    ctx.strokeStyle = '#2a2f3a';
    ctx.fillStyle = '#8b949e';
    ctx.font = '11px system-ui';
    ctx.lineWidth = 1;

    for (let i = 0; i <= 4; i++) {
      const val = (maxVal / 4) * i;
      const y = getY(val);
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();
      ctx.fillText('₹' + Math.round(val / 1000) + 'k', 8, y + 4);
    }

    for (let t = 0; t <= years; t += Math.max(1, Math.floor(years / 5))) {
      ctx.fillText(t + 'y', getX(t) - 8, h - 8);
    }

    ctx.beginPath();
    ctx.moveTo(getX(0), getY(0));
    corpus.forEach((v, t) => ctx.lineTo(getX(t), getY(v)));
    ctx.lineTo(getX(years), getY(0));
    ctx.closePath();
    ctx.fillStyle = 'rgba(59, 130, 246, 0.18)';
    ctx.fill();

    const drawLine = (arr, color) => {
      ctx.beginPath();
      arr.forEach((v, t) => t === 0 ? ctx.moveTo(getX(t), getY(v)) : ctx.lineTo(getX(t), getY(v)));
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    };

    drawLine(corpus, '#3b82f6');
    drawLine(invested, '#10b981');
  }

  Object.values(inputs).forEach(el => el.addEventListener('input', draw));
  window.addEventListener('resize', draw);
  draw();
</script>
</body>
</html>
